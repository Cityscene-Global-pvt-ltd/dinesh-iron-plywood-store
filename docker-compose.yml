name: ${PROJECT_NAME}

services:
  plywood-backend:
    image: ${BACKEND_IMAGE}:${BACKEND_TAG}

    container_name: ${PROJECT_NAME}-backend

    restart: unless-stopped

    env_file:
      - ./backend/backend.env

    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"

    networks:
      - shared

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared:
    external: true
    name: shared
