name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cityscene-global-pvt-ltd/plywood-store
  APP_DIR: /opt/apps/plywood-store/app
  # Build-time value only; not a secret. Frontend calls the API through Caddy on
  # the same origin, so no CORS preflight is needed in production.
  VITE_API_URL: https://iron.citysceneglobal.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          VITE_API_URL="${{ env.VITE_API_URL }}" npm run build

      - name: Stage frontend for upload
        run: mv frontend/dist frontend/dist.new

      - name: Upload frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_HOST_FINGERPRINT }}
          source: "frontend/dist.new/"
          target: "${{ env.APP_DIR }}"
          overwrite: true
          timeout: 5m

      - name: Deploy backend and activate frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_HOST_FINGERPRINT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -eu
            cd "${{ env.APP_DIR }}"

            git pull --ff-only

            export BACKEND_TAG="sha-${{ github.sha }}"
            docker compose pull plywood-backend
            docker compose up -d --wait plywood-backend

            backend_port="$(sed -n 's/^BACKEND_PORT=//p' .env | tail -n 1)"
            backend_port="${backend_port:-5000}"
            curl -fsS --retry 10 --retry-delay 3 "http://127.0.0.1:${backend_port}/api/health"

            rm -rf frontend/dist.prev
            if [ -d frontend/dist ]; then
              mv frontend/dist frontend/dist.prev
            fi
            mv frontend/dist.new frontend/dist

            test -f frontend/dist/index.html
